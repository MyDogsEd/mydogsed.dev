# Workflow to build and deploy the blog to GitHub Pages
name: Build Blog and Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# Cancel any currently running deployment if a new one is triggered. This ensures that only the latest deployment will run, and prevents multiple deployments from running at the same time.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  
  # Run the build python script
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Packages
        run: pip install -r requirements.txt

      - name: Run Build Script
        run: python ./scripts/build_blog.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
